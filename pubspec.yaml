name: segunda_opinion_panel
description: Panel de 2daOpinion, vista previa operativa sin datos reales.
publish_to: none
version: 0.1.0+1
environment:
  sdk: ^3.11.5
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  cupertino_icons: ^1.0.8
  firebase_core: 4.13.0
  firebase_core_web: 3.10.0
  firebase_auth: ^6.5.7
  cloud_functions: ^6.0.0
  cloud_firestore: ^6.8.0
dev_dependencies:
  flutter_web_plugins:
    sdk: flutter
  firebase_auth_web: ^6.2.6
  cloud_functions_web: ^5.1.12
  cloud_firestore_web: ^5.0.0
  http: ^1.0.0
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/images/logo.png
  fonts:
    - family: Montserrat
      fonts:
        - asset: assets/fonts/Montserrat.ttf
